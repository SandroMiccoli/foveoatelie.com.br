<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} — {{ site.tagline }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ site.url }}/">
  <meta name="theme-color" content="#17130F">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="{{ site.title }}">
  <meta name="apple-mobile-web-app-title" content="Foveō">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ site.locale }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ site.title }} — {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:image" content="{{ site.url }}/assets/og.jpg">
  <meta property="og:image:secure_url" content="{{ site.url }}/assets/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.title }} — {{ site.tagline }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ site.title }} — {{ site.tagline }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/og.jpg">
  <meta name="twitter:image:alt" content="{{ site.title }} — {{ site.tagline }}">

  <link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/icons/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ '/assets/icons/favicon-16.png' | relative_url }}" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">

  <link rel="preload" href="{{ '/assets/brand/logo-claro.svg' | relative_url }}" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  {{ content }}
</body>
</html>
