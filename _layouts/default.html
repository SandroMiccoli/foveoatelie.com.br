<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta name="theme-color" content="#0D0908">
  <meta name="color-scheme" content="dark">
  {% if page.noindex %}
  <meta name="robots" content="noindex">
  {% endif %}

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("consent", "default", {
      ad_storage: "denied",
      ad_user_data: "denied",
      ad_personalization: "denied",
      analytics_storage: "denied",
      wait_for_update: 500
    });
    (function () {
      var host = location.hostname === "obrigado.foveoatelie.com.br";
      var choice = null;
      try { choice = localStorage.getItem("fv-consent"); } catch (e) {}
      if (!host) return;
      if (choice === "granted") gtag("consent", "update", { analytics_storage: "granted" });
      var script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=G-H43WTD3XEE";
      document.head.appendChild(script);
      gtag("js", new Date());
      gtag("config", "G-H43WTD3XEE");
    })();
  </script>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Foveō Ateliê">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Foveō Ateliê — Rituais de cuidado através do toque">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/og.jpg">
  <meta name="twitter:image:alt" content="Foveō Ateliê — Rituais de cuidado através do toque">

  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=2" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ '/assets/favicon-16.png' | relative_url }}?v=2" type="image/png" sizes="16x16">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=2" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v=2" sizes="180x180">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  {% if page.preload %}
  <link rel="preload" as="image" href="{{ page.preload | relative_url }}">
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {{ content }}
</body>
</html>
