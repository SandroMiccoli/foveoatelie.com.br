{%- assign c = site.data.colecao -%}
<a class="skip" href="#conteudo">Ir para o conteúdo</a>

<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="logo-crop">
        <img
          src="{{ '/assets/logo-claro.svg' | relative_url }}"
          alt="Foveō Ateliê"
          width="1014"
          height="586"
          decoding="async"
        >
      </span>
    </a>
  </div>
</header>

<main id="conteudo">
  <div class="band obrigado-band">
    <div
      class="wrap obrigado-inner"
      id="pedido-pagina"
      data-supabase-url="{{ site.supabase.url }}"
      data-supabase-key="{{ site.supabase.anon_key }}"
      data-whatsapp="{{ c.whatsapp }}"
      data-home="{{ '/' | relative_url }}"
      data-rastreio="{{ '/rastreio/' | relative_url }}"
    >
      <img
        class="seal obrigado-seal"
        src="{{ '/assets/o-seal-claro.svg' | relative_url }}"
        alt=""
        width="1080"
        height="1080"
        decoding="async"
      >
      <p class="stock pedido-status" id="pedido-status" hidden>
        <span class="stock-dot" aria-hidden="true"></span>
        <span id="pedido-status-rotulo"></span>
      </p>
      <p class="obrigado-msg" id="pedido-titulo" aria-live="polite">Conferindo o pagamento.</p>
      <p class="pedido-nota" id="pedido-nota" hidden></p>
      <div class="pedido-resumo" id="pedido-resumo" hidden></div>
      <p class="pedido-nota" id="pedido-prazo" hidden></p>
      <div class="pedido-acoes" id="pedido-acoes" hidden>
        <a class="pedido-retentar" id="pedido-retentar" hidden>Tentar pagar de novo</a>
        <button type="button" class="cta pedido-conferir" id="pedido-conferir" hidden>Conferir pagamento de novo</button>
        <a class="cta" id="pedido-acao" hidden></a>
        <a class="cta" id="pedido-whatsapp" hidden>Falar com a Foveō</a>
      </div>
      <p class="pedido-rastreio-link" id="pedido-secundario" hidden>
        <a id="pedido-secundario-link" href="{{ '/rastreio/' | relative_url }}">Acompanhar pedido</a>
        <button type="button" id="pedido-tentar-de-novo" hidden>Tentar de novo</button>
      </p>
      <noscript><p class="pedido-nota">Ative o JavaScript para ver o pedido.</p></noscript>
    </div>
  </div>
</main>

{% include footer.html %}
<script src="{{ '/assets/js/pedido-status-lib.js' | relative_url }}"></script>
<script src="{{ '/assets/js/pedido.js' | relative_url }}"></script>
