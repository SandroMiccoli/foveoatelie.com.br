{%- assign c = site.data.colecao -%}
{%- capture wa_geral -%}https://wa.me/{{ c.whatsapp }}?text={{ c.mensagem_geral | uri_escape | replace: '+', '%20' }}{%- endcapture -%}
<footer class="site-footer">
  <div class="wrap footer-inner">
    <img
      class="seal"
      src="{{ '/assets/o-seal-claro.svg' | relative_url }}"
      alt=""
      width="1080"
      height="1080"
      decoding="async"
    >
    <div class="footer-social">
      <a class="footer-icon" href="{{ wa_geral }}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp da Foveō">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 20.2a8.2 8.2 0 0 1-3.9-1l-3.3.9.9-3.2A8.2 8.2 0 1 1 12 20.2Z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M9.1 9.6c.2-.5.4-.5.6-.5h.4c.2 0 .4.1.5.4.2.5.6 1.4.7 1.6.1.1 0 .3-.1.4l-.3.3c-.1.1-.2.3 0 .5.2.3.7 1.1 1.5 1.5.5.3.9.3 1.1.2.2-.1.4-.4.6-.6.1-.2.3-.2.5-.1l1.1.5c.2.1.3.2.4.3 0 .2 0 .5-.2.7-.2.3-.8.7-1.1.8-.4.1-1.1 0-2.1-.5-1.1-.5-2-1.5-2.5-2.2-.5-.7-1.1-1.6-1.1-2.2 0-.4.2-.9.4-1.1Z"/>
        </svg>
      </a>
      <a class="footer-icon" href="{{ c.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram da Foveō">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="17.35" cy="6.7" r="0.9" fill="currentColor"/>
        </svg>
      </a>
    </div>
    <p class="legal">© Foveō Ateliê</p>
    <p class="legal-links">
      <a href="{{ '/privacidade/' | relative_url }}"{% if page.url == "/privacidade/" %} aria-current="page"{% endif %}>Privacidade</a>
      <button type="button" data-consent-open>Preferências de cookies</button>
    </p>
  </div>
</footer>
