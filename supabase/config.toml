project_id = "bbksditqlgdjftwowtje"

# A sacola chama estas funções com a chave publishable do site, que não é um JWT.
# O webhook do Mercado Pago também chega sem JWT.
[functions.cotar-frete]
verify_jwt = false

[functions.criar-pedido]
verify_jwt = false

[functions.webhook-mercado-pago]
verify_jwt = false

[functions.consultar-pedido]
verify_jwt = false

# O painel manda o JWT do usuário logado. O gateway confere a assinatura;
# a função ainda exige contato@foveoatelie.com.br.
[functions.reembolsar-pedido]
verify_jwt = true

[functions.etiquetas-melhor-envio]
verify_jwt = true

[functions.notificar-cliente]
verify_jwt = true

# O Melhor Envio chama sem JWT. A função confere X-ME-Signature.
[functions.webhook-melhor-envio]
verify_jwt = false

# A cliente consulta com a chave publishable, que não é um JWT.
[functions.rastrear-pedido]
verify_jwt = false

# O painel manda o JWT do admin. O cron manda a service role.
# verify_jwt TEM de ficar true. papelDoJwt só lê o papel do payload;
# a assinatura é do gateway. Sem isso, qualquer um forja service_role.
[functions.despachar-avisos]
verify_jwt = true

# pg_cron chama com a service role do vault.
# verify_jwt TEM de ficar true, pelo mesmo motivo de despachar-avisos.
[functions.manutencao-diaria]
verify_jwt = true
