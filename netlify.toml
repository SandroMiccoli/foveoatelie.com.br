# Painel em admin.foveoatelie.com.br. Este arquivo vale para o branch
# `admin`. O site de produção continua no branch main, com o netlify.toml
# de lá (Jekyll). Não fixe o comando de build no painel da Netlify: um
# comando na interface vale para todos os deploys e atropela este arquivo.

[build]
  command = "echo painel estatico"
  publish = "admin"

[[redirects]]
  from = "/pedidos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pedidos/"
  to = "/pedidos"
  status = 301

[[redirects]]
  from = "/estoque"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/estoque/"
  to = "/estoque"
  status = 301

[[redirects]]
  from = "/clientes"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/clientes/"
  to = "/clientes"
  status = 301

[[redirects]]
  from = "/avisos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/avisos/"
  to = "/avisos"
  status = 301

[[redirects]]
  from = "/respostas"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/respostas/"
  to = "/respostas"
  status = 301

[[redirects]]
  from = "/entrar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/entrar/"
  to = "/entrar"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://bbksditqlgdjftwowtje.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-cache"
