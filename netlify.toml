[build]
  # bundle exec carrega jekyll-seo-tag e jekyll-sitemap do Gemfile.lock.
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"

# Indexação
# [[headers]] aqui valeria também para a produção, então o noindex não
# fica neste arquivo. _plugins/seo_robots.rb lê CONTEXT no build:
# production (e build local, sem CONTEXT) permanece indexável;
# branch-deploy — dev.foveoatelie.com.br / dev--foveoatelie.netlify.app —
# e deploy-preview gravam _site/_headers com X-Robots-Tag: noindex.
# A Netlify não coloca esse header no deploy mais recente de cada branch.

# O HTML referencia main.css com ?v=<timestamp do build> (_layouts/default.html),
# então cada deploy troca a URL e o arquivo pode ficar em cache por um ano.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
