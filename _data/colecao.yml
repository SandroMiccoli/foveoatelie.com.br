ritual:
  rotulo: "Como acontece"
  titulo: "O ritual"
  lead: "O ritual começa na intenção, ganha forma no toque e reverbera para além dele."
  nota: "Uma sequência intencional de pequenos gestos. Não exige regras rígidas nem ocasiões especiais."
  momentos:
    - numero: "01"
      nome: "Preparar"
      texto: "Organizar o ambiente, reduzir as distrações e criar disponibilidade. O ritual começa antes do toque — na preparação do espaço, na intenção, na respiração e na desaceleração."
    - numero: "02"
      nome: "Aquecer"
      texto: "Acenda a vela e deixe o calor transformar a superfície em óleo. Aguarde até que se forme uma camada homogênea de óleo por toda a superfície da vela, alcançando toda a circunferência da lata. Quando houver uma quantidade suficiente de óleo, apague a chama usando a própria tampa da vela. Nunca sopre a vela: ao soprar, pequenas partículas e cinzas do pavio podem cair dentro do óleo. Depois de apagar a chama, aguarde alguns segundos e, antes de espalhar sobre o corpo, verifique a temperatura do óleo."
    - numero: "03"
      nome: "Tocar"
      texto: "O óleo pode ser colocado primeiro nas mãos e então espalhado pelo corpo, ou ir diretamente à pele. Deixe o óleo acompanhar o movimento das mãos. Perceba sua temperatura, textura e deslizamento. Experimente diferentes ritmos e pressões e observe como o corpo responde."
    - numero: "04"
      nome: "Reverberar"
      texto: "Quando a massagem terminar, permaneça alguns instantes percebendo o que ficou. Observe a sensação do óleo sobre a pele, o calor que permanece no corpo, o aroma que continua presente e as sensações produzidas pelo toque. Perceba como a experiência continua reverberando no corpo mesmo depois que o movimento termina."

base:
  rotulo: "Matéria e cuidado"
  titulo: "A base"
  materias:
    - nome: "Óleo de girassol"
      texto: "Leve e macio, o óleo de girassol proporciona o deslizamento necessário para a massagem. Ajuda as mãos a percorrerem o corpo com movimentos contínuos e fluidos."
      sensacao: "sedosa · macia · fluida · deslizante"
    - nome: "Cera de abelha"
      texto: "A cera de abelha dá estrutura à vela quando está sólida e, com o calor da chama, se transforma gradualmente em uma mistura líquida. Na pele, contribui para uma sensação mais envolvente e prolonga a emoliência do óleo."
      sensacao: "quente · envolvente · protetora · encorpada"
  cuidados:
    - "Apague a chama usando a própria tampa da vela."
    - "Nunca sopre a vela. Ao soprar, pequenas partículas e cinzas do pavio podem cair dentro do óleo."
    - "Aguarde alguns segundos para que o óleo se acomode. Antes de espalhar sobre o corpo, verifique a temperatura do óleo."
  sintese:
    - "Cuidado através do toque."
    - "Tempo para estar presente."
    - "Algo que permanece depois."

faq:
  rotulo: "Dúvidas"
  titulo: "Perguntas frequentes"
  itens:
    - pergunta: "O que é uma vela de massagem?"
      resposta: |-
        É uma vela feita para virar óleo de massagem. Ao ser acesa, ela derrete e se transforma em um óleo morno e perfumado, que pode ser espalhado direto sobre a pele durante a massagem.
    - pergunta: "Como usar?"
      resposta: |-
        Acenda a vela e deixe queimar por cerca de 5 minutos, até formar uma camada homogênea de óleo na superfície. Apague a chama, sempre com a tampa, espere alguns segundos e teste a temperatura no dorso da mão. Depois, despeje um pouco nas mãos ou direto sobre a pele e comece o toque.
    - pergunta: "O óleo queima a pele?"
      resposta: |-
        Não. A vela é feita para derreter a uma temperatura baixa, que fica morna e confortável na pele. Logo depois de apagar a chama, o óleo pode parecer quente demais para algumas pessoas, mas não queima. Por isso, recomendamos testar sempre no dorso da mão antes de usar.
    - pergunta: "Do que as velas são feitas?"
      resposta: |-
        Todas têm a mesma base, de óleo de girassol e cera de abelha. O que muda em cada vela é a manteiga vegetal (karité, manga ou cacau) e a combinação aromática.
    - pergunta: "Por que o pavio é de madeira?"
      resposta: |-
        Porque ele estala baixinho enquanto queima, como uma lareira acesa. É bem gostosinho :)
    - pergunta: "Quanto tempo dura uma vela?"
      resposta: |-
        A lata tem 100 ml e rende cerca de 6 massagens de corpo inteiro. Em massagens localizadas, cada vela rende muitas sessões.
    - pergunta: "Pode ser usada como vela aromática comum?"
      resposta: |-
        Pode, mas ela não terá a mesma duração. Recomendamos usar para massagem mesmo.
    - pergunta: "Serve para qualquer tipo de pele?"
      resposta: |-
        Nossas velas são formuladas para uso corporal e podem ser usadas em diferentes tipos de pele. Pessoas com pele sensível, dermatites ou alergia a algum dos componentes devem ter atenção especial. Recomendamos testar uma pequena quantidade em uma área da pele antes do uso.
    - pergunta: "Como faço um pedido?"
      resposta: |-
        Pelo WhatsApp: é só tocar em "Falar com a Foveō" ou no botão de cada vela.
    - pergunta: "Vocês entregam fora de Belo Horizonte?"
      resposta: |-
        Sim, para qualquer lugar do mundo. O frete é cobrado à parte.
    - pergunta: "Pode ser presente?"
      resposta: |-
        Pode demais! Preparamos uma embalagem especial, e você pode acrescentar uma pequena mensagem, escrita à mão em um bilhete.
